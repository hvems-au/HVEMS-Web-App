# Supabase CLI configuration for local development (`supabase start`).
# The hosted project is anvqykllajezwaasguqp (ap-southeast-2).
project_id = "hvems"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://admin.localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
# HVEMS-branded emails: generated by scripts/email/build-templates.mjs.
# Hosted projects: node scripts/email/apply-templates.mjs <ref> (docs/operations/auth-emails.md).

[auth.email.template.confirmation]
subject = "Confirm your email for HVEMS"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "You've been invited to HVEMS"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Your HVEMS sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new email for HVEMS"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.recovery]
subject = "Reset your HVEMS password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.reauthentication]
subject = "Your HVEMS verification code: {{ .Token }}"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Your HVEMS password was changed"
content_path = "./supabase/templates/password_changed_notification.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Your HVEMS sign-in email was changed"
content_path = "./supabase/templates/email_changed_notification.html"

[auth.email.notification.mfa_factor_enrolled]
enabled = true
subject = "An authenticator app was added to your HVEMS account"
content_path = "./supabase/templates/mfa_factor_enrolled_notification.html"

[auth.email.notification.mfa_factor_unenrolled]
enabled = true
subject = "An authenticator app was removed from your HVEMS account"
content_path = "./supabase/templates/mfa_factor_unenrolled_notification.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"
